[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-point-autoresearch"
version = "0.1.0"
description = "Durable mathematical autoresearch for line-versus-point test soundness"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
line-point-research = "line_point_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
